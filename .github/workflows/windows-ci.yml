name: RangeDesk Windows build and tests

# Feature branches build on their PR; main builds on push. Avoid duplicate
# expensive Windows jobs for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore solution
        run: dotnet restore RangeDesk.slnx
      - name: Run Windows tests
        run: dotnet test RangeDesk.slnx --configuration Release --no-restore --logger "trx;LogFileName=RangeDesk.trx"
      - name: Real HTTPS download benchmark (feature branch only)
        if: github.head_ref == 'feature/rangedesk-v5-recurring-automation'
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet run --project tools/RangeDesk.Benchmark/RangeDesk.Benchmark.csproj --configuration Release -- artifact/benchmark
          if ($LASTEXITCODE -ne 0) { Write-Warning "CDN benchmark was unavailable; see logs." }
      - name: Upload real HTTPS benchmark report
        if: always() && github.head_ref == 'feature/rangedesk-v5-recurring-automation'
        uses: actions/upload-artifact@v4
        with:
          name: RangeDesk-CDN-Benchmark
          path: artifact/benchmark/results.json
          retention-days: 7
          if-no-files-found: warn
      - name: Controlled loopback HTTP range benchmark (strong ETag and 1/4/8 connections)
        if: github.head_ref == 'feature/rangedesk-v5-postaction-controlled-bench'
        shell: pwsh
        run: dotnet run --project tools/RangeDesk.Benchmark/RangeDesk.Benchmark.csproj --configuration Release -- controlled artifact/controlled-benchmark
      - name: Upload controlled range benchmark report
        if: always() && github.head_ref == 'feature/rangedesk-v5-postaction-controlled-bench'
        uses: actions/upload-artifact@v4
        with:
          name: RangeDesk-Controlled-Range-Benchmark
          path: artifact/controlled-benchmark/controlled-results.json
          retention-days: 7
          if-no-files-found: error
      # Deliberately opt-in: one matrix on its own PR, never on main or
      # every ordinary build. Uses localhost only; no public load tests.
      - name: V7 controlled TCP matrix (6 connection counts, limits, recovery)
        if: github.head_ref == 'feature/ragedesk-v7-network-matrix' || (github.head_ref == 'feature/ragedesk-v7-auto-connections' || github.head_ref == 'feature/ragedesk-v7-1-reprobe')
        timeout-minutes: 12
        shell: pwsh
        run: dotnet run --project tools/RangeDesk.Benchmark/RangeDesk.Benchmark.csproj --configuration Release -- v7 artifact/v7-network-matrix
      - name: Upload V7 network matrix evidence
        if: always() && (github.head_ref == 'feature/ragedesk-v7-network-matrix' || (github.head_ref == 'feature/ragedesk-v7-auto-connections' || github.head_ref == 'feature/ragedesk-v7-1-reprobe'))
        uses: actions/upload-artifact@v4
        with:
          name: RangeDesk-V7-Network-Matrix
          path: artifact/v7-network-matrix/v7-results.json
          retention-days: 7
          if-no-files-found: warn
      - name: V7 auto 4-scenario TCP benchmark
        if: (github.head_ref == 'feature/ragedesk-v7-auto-connections' || github.head_ref == 'feature/ragedesk-v7-1-reprobe')
        timeout-minutes: 5
        shell: pwsh
        run: dotnet run --project tools/RangeDesk.Benchmark/RangeDesk.Benchmark.csproj --configuration Release -- v7auto artifact/v7-auto
      - name: Upload V7 auto benchmark
        if: always() && (github.head_ref == 'feature/ragedesk-v7-auto-connections' || github.head_ref == 'feature/ragedesk-v7-1-reprobe')
        uses: actions/upload-artifact@v4
        with:
          name: RangeDesk-V7-Auto-Benchmark
          path: artifact/v7-auto/v7-auto-results.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish portable Windows build
        run: dotnet publish src/RangeDesk.App/RangeDesk.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifact/RangeDesk
      - name: Publish restricted browser native host
        run: dotnet publish src/RangeDesk.NativeHost/RangeDesk.NativeHost.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifact/RangeDesk/NativeHost
      - name: Verify browser native messaging framing
        shell: pwsh
        run: ./browser-capture/test-native-host.ps1
      - name: Verify browser automatic capture, HTML5 video overlay and safe fallback
        run: node --test browser-capture/test-auto-capture.cjs browser-capture/test-video-overlay.cjs browser-capture/test-media-discovery.cjs
      - name: Publish opt-in Windows scheduler wake companion
        run: dotnet publish src/RangeDesk.SchedulerWake/RangeDesk.SchedulerWake.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifact/RangeDesk/SchedulerWake
      - name: Verify scheduler wake exits safely without enrolled Windows task
        shell: pwsh
        run: |
          & ./artifact/RangeDesk/SchedulerWake/RangeDesk.SchedulerWake.exe
          if ($LASTEXITCODE -ne 0) { throw "Closed-app wake smoke test failed" }
      - name: Package opt-in scheduler wake setup
        shell: pwsh
        run: Copy-Item -Path scheduler-wake -Destination artifact/RangeDesk/Scheduler -Recurse -Force
      - name: Package opt-in browser extensions and setup
        shell: pwsh
        run: Copy-Item -Path browser-capture -Destination artifact/RangeDesk/BrowserCapture -Recurse -Force
      - name: Build unsigned installer preview (installer branch only)
        if: github.head_ref == 'feature/rangedesk-v5-installer' || github.head_ref == 'feature/ragedesk-installer-release' || github.head_ref == 'feature/cobalt-flow-theme-and-actions'
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe", "$env:ProgramFiles\\Inno Setup 6\\ISCC.exe")
          $iscc = $paths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $paths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler is unavailable" }
          $source = (Resolve-Path 'artifact/RangeDesk').Path
          & $iscc 'installer/RangeDesk.iss' "/DSourceDir=$source"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path 'artifact/RangeDesk-Setup-0.8.0-preview.2-win-x64.exe')) { throw "Installer was not created" }
      - name: Test per-user install, uninstall and state preservation
        if: github.head_ref == 'feature/rangedesk-v5-installer' || github.head_ref == 'feature/ragedesk-installer-release' || github.head_ref == 'feature/cobalt-flow-theme-and-actions'
        shell: pwsh
        run: |
          $stateFolder = Join-Path $env:LOCALAPPDATA 'RangeDesk'
          New-Item -ItemType Directory -Path $stateFolder -Force | Out-Null
          $sentinel = Join-Path $stateFolder 'installer-preservation-smoke.txt'
          [IO.File]::WriteAllText($sentinel, 'preserve-this-user-data')
          $install = Join-Path $env:TEMP 'RangeDesk-release-smoke'
          $setup = (Resolve-Path 'artifact/RangeDesk-Setup-0.8.0-preview.2-win-x64.exe').Path
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/LANG=sw', "/DIR=$install") -PassThru -Wait
          if ($proc.ExitCode -ne 0 -or -not (Test-Path (Join-Path $install 'RangeDesk.exe'))) { throw "Silent install failed" }
          # A real installed app must be discoverable via Apps & Features and Start.
          $registry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $appRecord = Get-ChildItem $registry | ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -like 'RangeDesk 0.8.0*' } | Select-Object -First 1
          if (-not $appRecord -or -not $appRecord.UninstallString) {
            throw 'Missing Programs & Features uninstall registration for current user'
          }
          $startLink = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\RangeDesk\RangeDesk.lnk'
          if (-not (Test-Path $startLink)) { throw 'Start Menu shortcut missing' }
          if (-not (Test-Path (Join-Path $install 'BrowserCapture\chromium\manifest.json'))) {
            throw 'Installed browser extension assets missing'
          }
          # A second install simulates a same-version update and must not remove catalog state.
          $upgrade = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT',
            '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/LANG=en', "/DIR=$install") -PassThru -Wait
          if ($upgrade.ExitCode -ne 0 -or -not (Test-Path $sentinel)) {
            throw 'Upgrade test failed to preserve saved data'
          }
          $uninstall = Join-Path $install 'unins000.exe'
          if (-not (Test-Path $uninstall)) { throw "Uninstaller missing" }
          $proc = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Uninstall failed" }
          if (-not (Test-Path $sentinel)) { throw "User data was removed during uninstall" }
          Remove-Item -LiteralPath $sentinel -Force
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path artifact/RangeDesk/* -DestinationPath artifact/RangeDesk-Preview-win-x64.zip -Force
      - name: Upload portable EXE preview
        uses: actions/upload-artifact@v4
        with:
          name: RangeDesk-Preview-win-x64
          path: artifact/RangeDesk-Preview-win-x64.zip
          retention-days: 7
          if-no-files-found: error
      - name: Upload unsigned Windows installer preview
        if: github.head_ref == 'feature/rangedesk-v5-installer' || github.head_ref == 'feature/ragedesk-installer-release' || github.head_ref == 'feature/cobalt-flow-theme-and-actions'
        uses: actions/upload-artifact@v4
        with:
          name: RangeDesk-Setup-Preview-win-x64
          path: artifact/RangeDesk-Setup-0.8.0-preview.2-win-x64.exe
          retention-days: 7
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RangeDesk-Test-Reports
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
          retention-days: 7
