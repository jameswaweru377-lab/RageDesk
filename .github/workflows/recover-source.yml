name: Import archived RangeDesk v4 source

on:
  push:
    branches: [main, "recover/rangedesk-v4"]
    paths: [".github/workflows/recover-source.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET for recovery verification
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
      - name: Download and verify original source snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'RangeDesk-v4-source.zip'
          $url = 'https://drive.google.com/uc?export=download&id=1g3MVkxs6eKpAcRwtya1tOFaG32R0UCft'
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 10
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'b1a2a9d94d7ad28ad50c13a0d234b3bb2a88023a71e1bd0dc6fefdadd063bf5b'
          if ($actual -ne $expected) {
            throw "The downloaded source archive failed its checksum. The Drive file may not be publicly downloadable. Expected $expected, got $actual. No code will be committed."
          }
          $destination = Join-Path $env:RUNNER_TEMP 'RangeDeskRecovered'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          foreach ($required in @('RangeDesk.slnx', 'global.json', 'src/RangeDesk.App/RangeDesk.App.csproj', 'src/RangeDesk.Core/Transfer/HttpTransfer.cs', 'tests/RangeDesk.Tests/RangeDesk.Tests.csproj')) {
            if (!(Test-Path -LiteralPath (Join-Path $destination $required))) { throw "Source archive missing $required" }
          }
          Copy-Item -Path (Join-Path $destination '*') -Destination . -Recurse -Force
          @'
          work/
          **/bin/
          **/obj/
          .vs/
          *.user
          *.suo
          TestResults/
          artifact/
          **/*.pdb
          *.msi
          '@ | Set-Content -Path .gitignore -Encoding utf8
          dotnet restore RangeDesk.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed; source not published.' }
          dotnet test RangeDesk.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed; source not published.' }
          dotnet publish src/RangeDesk.App/RangeDesk.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifact/RangeDesk
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed; source not published.' }
          Compress-Archive -Path artifact/RangeDesk/* -DestinationPath artifact/RangeDesk-v4-Recovery-Preview.zip -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B recover/rangedesk-v4
          git add .gitignore README.md RangeDesk.slnx global.json src tests
          git commit -m "chore: recover verified original RangeDesk v4 source"
          git push --set-upstream origin recover/rangedesk-v4
      - name: Upload validated Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: RangeDesk-v4-Recovery-Preview
          path: artifact/RangeDesk-v4-Recovery-Preview.zip
          retention-days: 7
          if-no-files-found: error
      - name: Next steps
        shell: pwsh
        run: Write-Host 'Recovered branch pushed after successful Windows build/tests. Verify the downloaded preview manually before merge.'
